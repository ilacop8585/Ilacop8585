name: Temporary LUMEN v0.4.1 EXECUTE Build

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout encrypted build payload
        uses: actions/checkout@v4

      - name: Decrypt and verify corrected LUMEN source
        shell: bash
        run: |
          set -euo pipefail
          echo '56b5247954b30a0c16eda4ee00525022206379d533847b51397904936c9bde62  payload-v041-r3/part.000' | sha256sum -c -
          echo '95b39ad90b42ae1f7b057beaa187ef6d1c2be89fe0e1af4ace92997680aeec0a  payload-v041-r3/part.001' | sha256sum -c -
          echo '1e13589be567e21e902806332793241e078db98c8e0c1232b687fa1d1201d360  payload-v041-r3/part.002' | sha256sum -c -
          echo '8a8c408f455e10f8be8b78785ae50190920fd85b15f424eb17c6e3a29856ada2  payload-v041-r2/part.001' | sha256sum -c -
          cat payload-v041-r3/part.000 payload-v041-r3/part.001 payload-v041-r3/part.002 payload-v041-r2/part.001 | tr -d '\r\n' | base64 -d > /tmp/lumen-source.tar.gz.enc
          echo '90fd5dd63bd071b37494be77c210b2c3f92fde187b729a98dce1d48373784dc6  /tmp/lumen-source.tar.gz.enc' | sha256sum -c -
          curl --fail --show-error --silent --location \
            'https://xquckndlrrsskyuvbqaz.supabase.co/functions/v1/lumen-build-key-v041-temp?token=ce712ce9a30ef5575d84f3d00110fcab376f3a5c81504709' \
            -o /tmp/lumen-build-key
          test -s /tmp/lumen-build-key
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in /tmp/lumen-source.tar.gz.enc \
            -out /tmp/lumen-source.tar.gz \
            -pass file:/tmp/lumen-build-key
          echo '59f30786803c6e48daaa97d72a437db3adea9fb4a08340695b83f271121ccd8a  /tmp/lumen-source.tar.gz' | sha256sum -c -
          mkdir -p "$GITHUB_WORKSPACE/lumen"
          tar -xzf /tmp/lumen-source.tar.gz -C "$GITHUB_WORKSPACE/lumen"
          rm -f /tmp/lumen-build-key /tmp/lumen-source.tar.gz.enc
          test -f "$GITHUB_WORKSPACE/lumen/settings.gradle.kts"
          test -f "$GITHUB_WORKSPACE/lumen/app/build.gradle.kts"
          test -f "$GITHUB_WORKSPACE/lumen/app/src/main/java/it/lumen/accessibility/ui/CloudVoiceActivity.kt"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Record Red Queen reachability
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail --show-error --silent --location \
            -H 'Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1bXZxeXNydm1va2R2YmNiY2R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NDE1MTksImV4cCI6MjEwMjAxNzUxOX0.4GRPadU_3xK9AFEJM48mKEdB920_-d35duqMrVSzicc' \
            -H 'apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1bXZxeXNydm1va2R2YmNiY2R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NDE1MTksImV4cCI6MjEwMjAxNzUxOX0.4GRPadU_3xK9AFEJM48mKEdB920_-d35duqMrVSzicc' \
            'https://cumvqysrvmokdvbcbcdt.supabase.co/functions/v1/lumen-red-queen')"
          printf '%s' "$BODY" > /tmp/red-queen-health.json
          python3 - "$BODY" <<'PY'
          import json,sys
          x=json.loads(sys.argv[1])
          assert x.get('ok') is True, x
          print('Red Queen reachable; provider configured =', x.get('openrouter_configured'))
          PY

      - name: Build corrected LUMEN APK
        working-directory: lumen
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        working-directory: lumen
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signer.txt
          OUT="app/build/outputs/apk/debug/LUMEN-ACCESSIBILITY-v0.4.1-EXECUTE.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee app/build/outputs/apk/debug/LUMEN-ACCESSIBILITY-v0.4.1-EXECUTE.sha256
          HEALTH="$(cat /tmp/red-queen-health.json)"
          {
            echo "LUMEN ACCESSIBILITY v0.4.1 EXECUTE"
            echo "source_snapshot_sha256=59f30786803c6e48daaa97d72a437db3adea9fb4a08340695b83f271121ccd8a"
            echo "canonical_repo=ilacop8585/lumen-accessibility-android"
            echo "canonical_branch=lumen-v0.4-aura"
            echo "red_queen_health=$HEALTH"
            echo "built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            cat signer.txt
            sha256sum "$OUT"
          } > app/build/outputs/apk/debug/BUILD_REPORT.txt

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: LUMEN-ACCESSIBILITY-v0.4.1-EXECUTE
          path: |
            lumen/app/build/outputs/apk/debug/LUMEN-ACCESSIBILITY-v0.4.1-EXECUTE.apk
            lumen/app/build/outputs/apk/debug/LUMEN-ACCESSIBILITY-v0.4.1-EXECUTE.sha256
            lumen/app/build/outputs/apk/debug/BUILD_REPORT.txt
          if-no-files-found: error
