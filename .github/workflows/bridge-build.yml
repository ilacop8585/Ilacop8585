name: Build NEXUS Universal Bridge 2.1.0

on:
  push:
    branches:
      - bridge-build-210
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests and APK build
        run: gradle -p bridge-android testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Prepare single final APK
        run: |
          cp bridge-android/app/build/outputs/apk/debug/app-debug.apk NEXUS-Universal-Bridge-2.1.0-FINAL.apk
          sha256sum NEXUS-Universal-Bridge-2.1.0-FINAL.apk | tee NEXUS-Universal-Bridge-2.1.0-FINAL.sha256
          unzip -t NEXUS-Universal-Bridge-2.1.0-FINAL.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs NEXUS-Universal-Bridge-2.1.0-FINAL.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging NEXUS-Universal-Bridge-2.1.0-FINAL.apk | tee NEXUS-Universal-Bridge-2.1.0-badging.txt
          grep -q "package: name='com.nexus.universalbridge.finalapp'" NEXUS-Universal-Bridge-2.1.0-badging.txt
          grep -q "versionName='2.1.0'" NEXUS-Universal-Bridge-2.1.0-badging.txt
          grep -q "application-label:'NEXUS Universal Bridge'" NEXUS-Universal-Bridge-2.1.0-badging.txt

      - name: Upload only final artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Universal-Bridge-2.1.0-FINAL
          path: |
            NEXUS-Universal-Bridge-2.1.0-FINAL.apk
            NEXUS-Universal-Bridge-2.1.0-FINAL.sha256
            NEXUS-Universal-Bridge-2.1.0-badging.txt
          if-no-files-found: error
          retention-days: 30
