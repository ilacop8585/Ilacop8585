name: Android 35 Compose Room Offline Cache

on:
  push:
    branches:
      - infra/android-toolchain-node-fabric-20260813
    paths:
      - .github/workflows/hangul-dependency-cache.yml

permissions:
  contents: read

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Download Gradle 8.9
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/hangul-toolchain"
          curl -fL --retry 3 -o "$RUNNER_TEMP/hangul-toolchain/gradle-8.9-bin.zip" https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q "$RUNNER_TEMP/hangul-toolchain/gradle-8.9-bin.zip" -d "$RUNNER_TEMP/hangul-toolchain"

      - name: Create dependency-warm Android project
        shell: bash
        run: |
          set -euxo pipefail
          P="$RUNNER_TEMP/hangul-cachewarm"
          mkdir -p "$P/app/src/main/java/cache/warm" "$P/app/src/test/java/cache/warm" "$P/app/src/androidTest/java/cache/warm" "$P/app/schemas"
          cat > "$P/settings.gradle.kts" <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AndroidDependencyWarm"
          include(":app")
          EOF
          cat > "$P/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
              id("org.jetbrains.kotlin.kapt") version "2.0.21" apply false
          }
          EOF
          cat > "$P/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF
          cat > "$P/app/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("org.jetbrains.kotlin.kapt")
          }
          android {
              namespace = "cache.warm"
              compileSdk = 35
              defaultConfig {
                  applicationId = "cache.warm"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
                  vectorDrawables.useSupportLibrary = true
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              packaging { resources.excludes += "/META-INF/{AL2.0,LGPL2.1}" }
          }
          kapt {
              correctErrorTypes = true
              arguments { arg("room.schemaLocation", "$projectDir/schemas") }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation("androidx.navigation:navigation-compose:2.8.5")
              implementation("androidx.compose.ui:ui:1.7.6")
              implementation("androidx.compose.ui:ui-tooling-preview:1.7.6")
              implementation("androidx.compose.material3:material3:1.3.1")
              debugImplementation("androidx.compose.ui:ui-tooling:1.7.6")
              implementation("androidx.room:room-runtime:2.7.2")
              implementation("androidx.room:room-ktx:2.7.2")
              kapt("androidx.room:room-compiler:2.7.2")
              testImplementation("junit:junit:4.13.2")
              androidTestImplementation("androidx.test.ext:junit:1.2.1")
              androidTestImplementation("androidx.test:core:1.6.1")
              androidTestImplementation("androidx.test:runner:1.6.2")
              androidTestImplementation("androidx.room:room-testing:2.7.2")
          }
          EOF
          cat > "$P/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@android:style/Theme.Material.Light.NoActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > "$P/app/src/main/java/cache/warm/MainActivity.kt" <<'EOF'
          package cache.warm
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Text
          import androidx.room.Database
          import androidx.room.Entity
          import androidx.room.PrimaryKey
          import androidx.room.RoomDatabase
          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { MaterialTheme { Text("offline cache warm") } }
              }
          }
          @Entity data class WarmEntity(@PrimaryKey val id: String)
          @Database(entities = [WarmEntity::class], version = 1, exportSchema = true)
          abstract class WarmDb : RoomDatabase()
          EOF
          cat > "$P/app/src/test/java/cache/warm/WarmTest.kt" <<'EOF'
          package cache.warm
          import org.junit.Assert.assertEquals
          import org.junit.Test
          class WarmTest { @Test fun warm() { assertEquals(2, 1 + 1) } }
          EOF
          cat > "$P/app/src/androidTest/java/cache/warm/WarmAndroidTest.kt" <<'EOF'
          package cache.warm
          import androidx.test.ext.junit.runners.AndroidJUnit4
          import org.junit.Assert.assertTrue
          import org.junit.Test
          import org.junit.runner.RunWith
          @RunWith(AndroidJUnit4::class) class WarmAndroidTest { @Test fun warm() { assertTrue(true) } }
          EOF

      - name: Warm exact plugin and dependency cache
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/hangul-gradle-home
        run: |
          set -euxo pipefail
          "$RUNNER_TEMP/hangul-toolchain/gradle-8.9/bin/gradle" -p "$RUNNER_TEMP/hangul-cachewarm" --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Prove modules cache works offline
        shell: bash
        run: |
          set -euxo pipefail
          MIN="$RUNNER_TEMP/hangul-min-home"
          mkdir -p "$MIN/caches"
          cp -a "$RUNNER_TEMP/hangul-gradle-home/caches/modules-2" "$MIN/caches/"
          GRADLE_USER_HOME="$MIN" "$RUNNER_TEMP/hangul-toolchain/gradle-8.9/bin/gradle" -p "$RUNNER_TEMP/hangul-cachewarm" --offline --no-daemon clean testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Package portable offline bundle in connector-sized parts
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/hangul-offline-bundle"
          mkdir -p "$OUT/android-sdk" "$OUT/gradle-home/caches"
          cp -a "$JAVA_HOME" "$OUT/jdk17"
          cp -a "$RUNNER_TEMP/hangul-toolchain/gradle-8.9" "$OUT/"
          cp -a "$RUNNER_TEMP/hangul-gradle-home/caches/modules-2" "$OUT/gradle-home/caches/"
          cp -a "$ANDROID_SDK_ROOT/platforms" "$OUT/android-sdk/"
          cp -a "$ANDROID_SDK_ROOT/build-tools" "$OUT/android-sdk/"
          cp -a "$ANDROID_SDK_ROOT/platform-tools" "$OUT/android-sdk/"
          cp -a "$ANDROID_SDK_ROOT/licenses" "$OUT/android-sdk/" || true
          printf 'AGP=8.7.3\nKOTLIN=2.0.21\nCOMPOSE_PLUGIN=2.0.21\nGRADLE=8.9\nJDK=17\nCOMPILE_SDK=35\nBUILD_TOOLS=35.0.0\nCACHE=modules-2-offline-verified\n' > "$OUT/TOOLCHAIN.txt"
          tar -C "$RUNNER_TEMP" -I 'gzip -1' -cf "$GITHUB_WORKSPACE/hangul-offline-bundle.tar.gz" hangul-offline-bundle
          sha256sum "$GITHUB_WORKSPACE/hangul-offline-bundle.tar.gz" > "$GITHUB_WORKSPACE/hangul-offline-bundle.tar.gz.sha256"
          split -b 300M -d -a 2 "$GITHUB_WORKSPACE/hangul-offline-bundle.tar.gz" "$GITHUB_WORKSPACE/hangul-offline.part."
          sha256sum "$GITHUB_WORKSPACE"/hangul-offline.part.* > "$GITHUB_WORKSPACE/hangul-offline.parts.sha256"
          ls -lh "$GITHUB_WORKSPACE"/hangul-offline.part.*

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: hangul-offline-manifest
          path: |
            hangul-offline-bundle.tar.gz.sha256
            hangul-offline.parts.sha256
          retention-days: 1

      - name: Upload part 00
        if: ${{ hashFiles('hangul-offline.part.00') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: hangul-offline-part-00
          path: hangul-offline.part.00
          retention-days: 1
          compression-level: 0
      - name: Upload part 01
        if: ${{ hashFiles('hangul-offline.part.01') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: hangul-offline-part-01
          path: hangul-offline.part.01
          retention-days: 1
          compression-level: 0
      - name: Upload part 02
        if: ${{ hashFiles('hangul-offline.part.02') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: hangul-offline-part-02
          path: hangul-offline.part.02
          retention-days: 1
          compression-level: 0
      - name: Upload part 03
        if: ${{ hashFiles('hangul-offline.part.03') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: hangul-offline-part-03
          path: hangul-offline.part.03
          retention-days: 1
          compression-level: 0
      - name: Upload part 04
        if: ${{ hashFiles('hangul-offline.part.04') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: hangul-offline-part-04
          path: hangul-offline.part.04
          retention-days: 1
          compression-level: 0
      - name: Upload part 05
        if: ${{ hashFiles('hangul-offline.part.05') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: hangul-offline-part-05
          path: hangul-offline.part.05
          retention-days: 1
          compression-level: 0
      - name: Upload part 06
        if: ${{ hashFiles('hangul-offline.part.06') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: hangul-offline-part-06
          path: hangul-offline.part.06
          retention-days: 1
          compression-level: 0
      - name: Upload part 07
        if: ${{ hashFiles('hangul-offline.part.07') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: hangul-offline-part-07
          path: hangul-offline.part.07
          retention-days: 1
          compression-level: 0
