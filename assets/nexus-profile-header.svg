      <stop offset="0.28" stop-color="#aab7c4"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="0.78" stop-color="#7d8996"/>
      <stop offset="1" stop-color="#dce5ed"/>
