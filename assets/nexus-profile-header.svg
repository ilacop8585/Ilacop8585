<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="400" viewBox="0 0 1400 400" role="img" aria-labelledby="title desc">
  <title id="title">N.E.X.U.S. — The Global Network for Security and Shared Knowledge</title>
  <desc id="desc">Institutional dark-blue N.E.X.U.S. banner with silver N emblem, international network and Seoul headquarters reference.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030812"/>
      <stop offset="0.55" stop-color="#071526"/>
      <stop offset="1" stop-color="#030a14"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="79%" cy="48%" r="62%">
      <stop offset="0" stop-color="#128cff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#0b5ca8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#06111f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
